# Builds the website (examples/) and puts it online on GitHub Pages, at every push to main.
name: Website

on:
  push:
    branches: [main]
  # Also by hand, from the Actions tab.
  workflow_dispatch:

# What the workflow may do with the repo: read the code, and publish on Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push waits for the running one instead of cutting it short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
