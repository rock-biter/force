<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FORCE: curtains</title>
    <meta
      name="description"
      content="Tall, narrow cloths of particles joined by springs, hanging side by side on the GPU: grab one with the pointer and pull it through the others."
    />
    <link rel="stylesheet" href="../site.css" />
  </head>
  <!-- The same page as heap-simulation, with the particles joined into cloths by springs
       (data-springs), and a pointer that grabs a cloth and drags it (data-pointer). -->
  <body
    class="stage"
    data-springs="curtains"
    data-sizes="1"
    data-max-particles="30000"
    data-friction="0.3"
    data-drag="0.5"
    data-pointer="grab"
    data-particles="10000" data-half="8" data-cloth="surface" data-target="6"
  >
    <nav class="crumb">
      <a href="../">← FORCE</a> · Curtains
      <p>Tall, narrow cloths, each held by its top row.</p>
      <p>Drag a cloth to pull it. Drag the empty space to turn the camera, two fingers on a phone.</p>
    </nav>
    <script type="module" src="../heap-simulation/main.ts"></script>
  </body>
</html>
