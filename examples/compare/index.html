<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FORCE: compare</title>
    <meta
      name="description"
      content="Every way of pushing touching particles apart that FORCE studied, running side by side, live, in the same scene."
    />
    <link rel="stylesheet" href="../site.css" />
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #e9e9e9;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        padding: 8px 16px;
        font: 14px/1.4 system-ui, sans-serif;
        background: #fff;
        border-bottom: 1px solid #ccc;
      }
      header .crumb {
        margin: 0;
      }
      header label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #tuning {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        margin: 0;
        padding: 2px 10px 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      #tuning legend {
        font-weight: 600;
        padding: 0 4px;
      }
      #tuning output {
        min-width: 2.5em;
        font-variant-numeric: tabular-nums;
      }
      #tuning input[type='number'] {
        width: 3.5em;
      }
      #time {
        font-variant-numeric: tabular-nums;
        color: #555;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panes {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        pointer-events: none;
      }
      @media (max-width: 900px) {
        #panes {
          grid-template-columns: repeat(2, 1fr);
          grid-template-rows: repeat(4, 1fr);
        }
      }
      .pane {
        position: relative;
        border: 1px solid #fff;
        font: 12px/1.35 system-ui, sans-serif;
      }
      /* the three versions of FORCE */
      .pane.ours {
        box-shadow: inset 0 0 0 2px rgba(78, 163, 255, 0.55);
      }
      .pane select {
        pointer-events: auto;
        margin: 6px;
        font-weight: 600;
        max-width: calc(100% - 12px);
      }
      .pane .source {
        margin: 0 8px;
        color: #555;
      }
      .pane .source a {
        pointer-events: auto;
      }
      .pane .stats {
        position: absolute;
        left: 8px;
        bottom: 6px;
        font-variant-numeric: tabular-nums;
      }
      footer {
        padding: 4px 16px;
        font: 12px/1.4 system-ui, sans-serif;
        color: #555;
        background: #fff;
        border-top: 1px solid #ccc;
      }
      #error {
        position: absolute;
        inset: 0;
        padding: 16px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="crumb"><a href="../">← FORCE</a> · compare</nav>
      <label>Scene <select id="scene"></select></label>
      <button id="restart" type="button">Restart</button>
      <button id="pause" type="button">Pause</button>
      <label><input id="slow" type="checkbox" /> Slow motion</label>
      <fieldset id="tuning">
        <legend>FORCE+ tunable</legend>
        <label title="The solver sees each mass as m^α: 1 is the real mass, 0 makes all equal">
          α <input id="alpha" type="range" min="0" max="1" step="0.05" /> <output></output>
        </label>
        <label title="In a pile the lower particle weighs e^(c × difference of levels) more">
          levels c <input id="levels" type="range" min="0" max="4" step="0.25" /> <output></output>
        </label>
        <label title="Passes over the contacts in each substep">
          rounds <input id="rounds" type="number" min="1" max="40" />
        </label>
        <label title="The step of 1/60 s is cut into this many substeps, each with its rounds">
          substeps <input id="substeps" type="number" min="1" max="16" />
        </label>
        <button id="defaults" type="button" title="α 0.5, c 2, 8 rounds, 1 substep">As FORCE+</button>
      </fieldset>
      <span id="time"></span>
    </header>
    <div id="stage">
      <div id="panes"></div>
    </div>
    <footer>
      These simulations run on the CPU, in JavaScript, because that keeps the comparisons simple to
      build. FORCE itself runs on the GPU: the chosen method is timed there in
      <a href="../contact-cost/">contact-cost</a>.
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
