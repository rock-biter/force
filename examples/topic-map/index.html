<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FORCE: topic map</title>
    <meta
      name="description"
      content="Every concept and every source met while building FORCE, a GPU physics engine for the web, as a graph in 3D: what we heard of, what we saw, what we studied."
    />
    <style>
      :root {
        --paper: #f2f1ec;
        --ink: #16161a;
        --grey: #85857f;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font: 11px / 1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
      }

      /* The layer of labels sits over the canvas and lets the mouse through to it. */
      .labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .label {
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .label.studied {
        font-weight: 700;
      }
      .label.mentioned {
        color: var(--grey);
      }

      /*
       * The left column: the title at the top, the list of topics under it, and the panel of the
       * selected topic at the bottom. The column itself lets the mouse through to the graph.
       */
      .side {
        position: fixed;
        top: 16px;
        left: 16px;
        bottom: 16px;
        z-index: 1; /* over the labels of the graph */
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        pointer-events: none;
      }
      .side > * {
        flex: none;
        pointer-events: auto;
      }

      /* The title, and under it how many topics are on the map. */
      .title {
        user-select: none;
      }
      .title h1,
      .title p {
        margin: 0;
        font: inherit;
      }
      .title h1 {
        font-weight: 700;
      }
      .title p {
        color: var(--grey);
      }

      /* The legend sits in the corner the graph leaves free: bottom right. */
      .legend {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 1; /* over the labels of the graph */
        user-select: none;
      }
      /* On a narrow window the panel takes the whole bottom: the legend goes under the title. */
      @media (max-width: 720px) {
        .legend {
          top: 64px;
          right: auto;
          bottom: auto;
          left: 16px;
        }
      }
      /* On the timeline, it moves up to leave the bottom to the timeline bar. */
      body[data-view="timeline"] .legend {
        bottom: 88px;
      }
      .legend table {
        border-collapse: collapse;
      }
      .legend td {
        padding: 0 10px 0 0;
      }
      .legend td:last-child {
        padding: 0;
        text-align: right;
        color: var(--grey);
      }
      /* A little air between the groups of the legend. */
      .legend .gap {
        border-top: 8px solid transparent;
      }

      .panel {
        margin-top: auto; /* at the bottom of the column, with or without the list */
        width: min(340px, calc(100vw - 58px));
        padding: 12px;
        border: 1px solid var(--ink);
        background: var(--paper);
      }
      .panel h2,
      .panel p {
        margin: 0;
        font: inherit;
      }
      .panel h2 {
        font-weight: 700;
      }
      .panel .meta {
        margin-bottom: 8px;
        color: var(--grey);
      }

      /* The same shapes the shader draws. */
      .mark {
        display: inline-block;
        width: 9px;
        height: 9px;
        box-sizing: border-box;
        border: 1.25px solid var(--mark, var(--ink));
        border-radius: 50%;
        vertical-align: -1px;
      }
      .mark.square {
        border-radius: 0;
      }
      .mark.studied {
        background: var(--mark, var(--ink));
      }
      .mark.seen {
        background: linear-gradient(to right, var(--mark, var(--ink)) 50%, transparent 50%);
      }

      .panel .actions {
        display: flex;
        gap: 16px;
        margin-top: 10px;
      }
      button,
      a {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      /* The two views: the one on screen is in bold. */
      .views {
        position: fixed;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 16px;
        user-select: none;
      }
      .views button {
        color: var(--grey);
        text-decoration: none;
      }
      .views button[aria-pressed="true"] {
        color: var(--ink);
        font-weight: 700;
        text-decoration: underline;
      }

      /*
       * The list of topics takes the room left between the title and the panel. It is as wide as
       * the panel, border included. The search field stays at its top, and the list scrolls
       * under it.
       */
      .toc {
        display: flex;
        flex-direction: column;
      }
      .side > .toc {
        flex: 0 1 auto;
        box-sizing: border-box;
        width: min(366px, calc(100vw - 32px));
        min-height: 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        user-select: none;
      }
      .toc .search {
        flex: none;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 4px 12px;
        border: 0;
        border-bottom: 1px solid var(--ink);
        border-radius: 0;
        outline: none;
        appearance: none;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        /* Safari does not let you type in a field that sits inside something with no selection. */
        -webkit-user-select: text;
        user-select: text;
      }
      .toc .search::placeholder {
        color: var(--grey);
      }
      .toc .search:focus {
        background: rgb(22 22 26 / 0.06);
      }
      .toc .list {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--grey) transparent;
      }
      /* A topic the search did not find, kept only because one that it found sits under it. */
      .toc li > button.around {
        opacity: 0.4;
      }
      .toc .nothing {
        margin: 0;
        padding: 4px 12px;
        color: var(--grey);
      }
      /* The name of an area stays in sight while its topics scroll under it. */
      .toc summary {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 6px;
        padding: 4px 12px;
        background: var(--paper);
        font-weight: 700;
        cursor: pointer;
      }
      .toc summary::-webkit-details-marker {
        display: none;
      }
      .toc summary::before {
        content: "▸";
      }
      .toc details[open] > summary::before {
        content: "▾";
      }
      .toc summary .count {
        margin-left: auto;
        color: var(--grey);
        font-weight: 400;
      }
      .toc ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .toc details > ul {
        padding: 0 8px 8px;
      }
      /* The topics that are part of another: indented, with a line down from the mark above. */
      .toc li > ul {
        margin-left: 8px;
        padding-left: 5px;
        border-left: 1px solid rgb(22 22 26 / 0.15);
      }
      .toc li > button {
        display: block;
        width: 100%;
        padding: 1px 4px;
        overflow: hidden;
        text-align: left;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The same weights as the labels of the graph. */
      .toc button.studied {
        font-weight: 700;
      }
      .toc button.mentioned {
        color: var(--grey);
      }
      .toc li > button:hover {
        background: rgb(22 22 26 / 0.06);
      }
      .toc li > button[aria-current] {
        background: rgb(22 22 26 / 0.14);
        color: var(--ink);
      }
      /* The list is there only in the map view, and only where there is room beside it. */
      body:not([data-view="map"]) .toc {
        display: none;
      }
      @media (max-width: 720px) {
        .toc {
          display: none;
        }
      }

      /* The timeline: a play button, the day, the last change, and a slider with the days. */
      .timeline {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 12px;
        user-select: none;
      }
      .timeline .now {
        display: flex;
        gap: 16px;
        margin-bottom: 4px;
      }
      .timeline .play {
        width: 64px;
        text-align: left;
        text-decoration: none;
      }
      .timeline .day {
        width: 56px;
        font-weight: 700;
      }
      .timeline .change {
        color: var(--grey);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .timeline input {
        display: block;
        width: 100%;
        margin: 0;
        accent-color: var(--ink);
      }
      .timeline .days {
        position: relative;
        height: 16px;
        color: var(--grey);
      }
      .timeline .days span {
        position: absolute;
        padding-left: 4px;
        border-left: 1px solid var(--grey);
      }

      /* The timeline bar is there only in the timeline view. */
      body:not([data-view="timeline"]) .timeline {
        display: none;
      }

      /* The page of a topic, over the graph. */
      .page {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 64px);
        padding: 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font: 12px / 1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .page[open] {
        display: flex;
        flex-direction: column;
      }
      .page::backdrop {
        background: rgb(242 241 236 / 0.85);
      }
      .page header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 24px;
        border-bottom: 1px solid var(--ink);
        color: var(--grey);
      }
      .page article {
        overflow: auto;
        padding: 8px 24px 32px;
      }
      .page h1 {
        font-size: 18px;
        line-height: 1.3;
      }
      .page h2 {
        margin-top: 32px;
        font-size: 14px;
      }
      .page h3 {
        font-size: 12px;
      }
      .page pre {
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--grey);
      }
      .page :not(pre) > code {
        background: rgb(22 22 26 / 0.07);
        padding: 1px 3px;
      }
      .page table {
        border-collapse: collapse;
      }
      .page th,
      .page td {
        padding: 4px 10px;
        border: 1px solid var(--grey);
        text-align: left;
        vertical-align: top;
      }
    </style>
  </head>
  <body data-view="map">
    <div class="side">
      <header class="title">
        <h1><a href="../">← FORCE</a> · topic map</h1>
        <p><span data-count="all"></span> topics</p>
      </header>
      <nav class="toc" aria-label="Topics">
        <input class="search" type="search" placeholder="search…" aria-label="Search the topics" />
        <div class="list"></div>
      </nav>
      <aside class="panel" hidden></aside>
    </div>
    <div class="legend">
      <table>
        <tr>
          <td><span class="mark studied"></span></td>
          <td>studied</td>
          <td data-count="studied"></td>
        </tr>
        <tr>
          <td><span class="mark seen"></span></td>
          <td>seen</td>
          <td data-count="seen"></td>
        </tr>
        <tr>
          <td><span class="mark mentioned"></span></td>
          <td>mentioned</td>
          <td data-count="mentioned"></td>
        </tr>
        <tr class="gap">
          <td><span class="mark"></span></td>
          <td>concept</td>
          <td></td>
        </tr>
        <tr>
          <td><span class="mark square"></span></td>
          <td>source</td>
          <td></td>
        </tr>
        <tbody class="areas"></tbody>
      </table>
    </div>
    <nav class="views">
      <button type="button" data-view="map" aria-pressed="true">map</button>
      <button type="button" data-view="timeline" aria-pressed="false">timeline</button>
    </nav>
    <div class="timeline">
      <div class="now">
        <button class="play" type="button">▶ play</button>
        <span class="day"></span>
        <span class="change"></span>
      </div>
      <input type="range" min="0" max="1" step="any" value="1" aria-label="Timeline" />
      <div class="days"></div>
    </div>
    <dialog class="page">
      <header>
        <span class="path"></span>
        <button class="close" type="button">close ×</button>
      </header>
      <article></article>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
