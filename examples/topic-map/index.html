<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FORCE: topic map</title>
    <meta
      name="description"
      content="Every concept and every source met while building FORCE, a GPU physics engine for the web, as a graph in 3D: what we heard of, what we saw, what we studied."
    />
    <style>
      :root {
        --paper: #f2f1ec;
        --ink: #16161a;
        --grey: #85857f;
        /* The paper, a little see-through: behind text that the graph passes under. */
        --veil: rgb(242 241 236 / 0.85);
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font: 11px / 1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      canvas {
        display: block;
      }

      /* The layer of labels sits over the canvas and lets the mouse through to it. */
      .labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .label {
        white-space: nowrap;
        transition: opacity 0.2s;
      }
      .label.studied {
        font-weight: 700;
      }
      .label.mentioned {
        color: var(--grey);
      }

      /*
       * The left column: the title at the top, the list of topics under it, and the panel of the
       * selected topic at the bottom. The column itself lets the mouse through to the graph. On a
       * narrow window it is as wide as the page, and the legend is its last row.
       */
      .side {
        position: fixed;
        top: 16px;
        left: 16px;
        bottom: 16px;
        z-index: 1; /* over the labels of the graph */
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        pointer-events: none;
      }
      .side > * {
        flex: none;
        pointer-events: auto;
      }

      /* The button that opens the list: only on a narrow window, where the list starts closed. */
      .toc-toggle {
        display: none;
      }

      /* The title, and under it how many topics are on the map. */
      .title {
        user-select: none;
      }
      .title h1,
      .title p {
        margin: 0;
        font: inherit;
      }
      .title h1 {
        font-weight: 700;
      }
      .title p {
        color: var(--grey);
      }

      /*
       * The legend: one line per group (how far we went, concept or source, the areas), with the
       * labels of a group side by side. It sits at the bottom, in the corner the panel leaves
       * free, and never grows wide enough to reach the panel. The mouse goes through it.
       */
      .side > .legend {
        position: fixed;
        right: 16px;
        bottom: 16px;
        max-width: calc(100vw - 414px);
        user-select: none;
        pointer-events: none;
      }
      /* On the timeline, it moves up to leave the bottom to the timeline bar. */
      body[data-view="timeline"] .legend {
        bottom: 88px;
      }
      .legend ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .legend li {
        white-space: nowrap;
      }
      .legend .count {
        color: var(--grey);
      }

      .panel {
        margin-top: auto; /* at the bottom of the column, with or without the list */
        width: min(340px, calc(100vw - 58px));
        padding: 12px;
        border: 1px solid var(--ink);
        background: var(--paper);
      }
      .panel h2,
      .panel p {
        margin: 0;
        font: inherit;
      }
      .panel h2 {
        font-weight: 700;
      }
      .panel .meta {
        margin-bottom: 8px;
        color: var(--grey);
      }

      /* The same shapes the shader draws. */
      .mark {
        display: inline-block;
        width: 9px;
        height: 9px;
        box-sizing: border-box;
        border: 1.25px solid var(--mark, var(--ink));
        border-radius: 50%;
        vertical-align: -1px;
      }
      .mark.square {
        border-radius: 0;
      }
      .mark.studied {
        background: var(--mark, var(--ink));
      }
      .mark.seen {
        background: linear-gradient(to right, var(--mark, var(--ink)) 50%, transparent 50%);
      }

      .panel .actions {
        display: flex;
        gap: 16px;
        margin-top: 10px;
      }
      button,
      a {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      /* The two views: the one on screen is in bold. */
      .views {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 2; /* over the bar the title becomes on a narrow window */
        display: flex;
        gap: 16px;
        user-select: none;
      }
      .views button {
        color: var(--grey);
        text-decoration: none;
      }
      .views button[aria-pressed="true"] {
        color: var(--ink);
        font-weight: 700;
        text-decoration: underline;
      }

      /*
       * The list of topics takes the room left between the title and the panel. It is as wide as
       * the panel, border included. The search field stays at its top, and the list scrolls
       * under it.
       */
      .toc {
        display: flex;
        flex-direction: column;
      }
      .side > .toc {
        flex: 0 1 auto;
        box-sizing: border-box;
        width: min(366px, calc(100vw - 32px));
        min-height: 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        user-select: none;
      }
      .toc .search {
        flex: none;
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 4px 12px;
        border: 0;
        border-bottom: 1px solid var(--ink);
        border-radius: 0;
        outline: none;
        appearance: none;
        background: var(--paper);
        color: var(--ink);
        font: inherit;
        /* Safari does not let you type in a field that sits inside something with no selection. */
        -webkit-user-select: text;
        user-select: text;
      }
      .toc .search::placeholder {
        color: var(--grey);
      }
      .toc .search:focus {
        background: rgb(22 22 26 / 0.06);
      }
      .toc .list {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: var(--grey) transparent;
      }
      /* A topic the search did not find, kept only because one that it found sits under it. */
      .toc li > button.around {
        opacity: 0.4;
      }
      .toc .nothing {
        margin: 0;
        padding: 4px 12px;
        color: var(--grey);
      }
      /* The name of an area stays in sight while its topics scroll under it. */
      .toc summary {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        gap: 6px;
        padding: 4px 12px;
        background: var(--paper);
        font-weight: 700;
        cursor: pointer;
      }
      .toc summary::-webkit-details-marker {
        display: none;
      }
      .toc summary::before {
        content: "▸";
      }
      .toc details[open] > summary::before {
        content: "▾";
      }
      .toc summary .count {
        margin-left: auto;
        color: var(--grey);
        font-weight: 400;
      }
      .toc ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .toc details > ul {
        padding: 0 8px 8px;
      }
      /* The topics that are part of another: indented, with a line down from the mark above. */
      .toc li > ul {
        margin-left: 8px;
        padding-left: 5px;
        border-left: 1px solid rgb(22 22 26 / 0.15);
      }
      .toc li > button {
        display: block;
        width: 100%;
        padding: 1px 4px;
        overflow: hidden;
        text-align: left;
        text-decoration: none;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The same weights as the labels of the graph. */
      .toc button.studied {
        font-weight: 700;
      }
      .toc button.mentioned {
        color: var(--grey);
      }
      .toc li > button:hover {
        background: rgb(22 22 26 / 0.06);
      }
      .toc li > button[aria-current] {
        background: rgb(22 22 26 / 0.14);
        color: var(--ink);
      }
      /* The list is there only in the map view. */
      body:not([data-view="map"]) .toc,
      body:not([data-view="map"]) .toc-toggle {
        display: none;
      }

      /*
       * A narrow window, such as a phone. The graph fills the page and passes under everything, so
       * the title becomes a bar across the top and the legend a strip across the bottom, each on
       * a veil of paper that keeps it readable. There is no room for the list beside the graph: it
       * starts closed, and a button under the bar opens it over the graph.
       */
      @media (max-width: 720px) {
        .side {
          right: 16px;
        }
        /* The bar and the strip reach the edges of the page, past the margins of the column. */
        .side > .title,
        .side > .legend {
          align-self: stretch;
          background: var(--veil);
          -webkit-backdrop-filter: blur(6px);
          backdrop-filter: blur(6px);
        }
        .side > .title {
          margin: -16px -16px 0;
          padding: 16px 16px 10px;
        }
        .toc-toggle {
          display: grid;
          place-items: center;
          width: 32px;
          height: 32px;
          border: 1px solid var(--ink);
          background: var(--paper);
        }
        .toc-toggle svg {
          grid-area: 1 / 1;
        }
        /* The button draws a magnifying glass while the list is closed, a cross while it is open. */
        .toc-toggle[aria-expanded="true"] .closed,
        .toc-toggle[aria-expanded="false"] .open {
          visibility: hidden;
        }
        /* Filled while a search is fading the graph, so a closed list still says so. */
        .toc-toggle[data-filtered] {
          background: var(--ink);
          color: var(--paper);
        }
        body:not([data-toc="open"]) .toc {
          display: none;
        }
        /* Safari on a phone zooms into a field whose text is smaller than 16px. */
        .toc .search {
          padding: 6px 12px;
          font-size: 16px;
        }
        /* Rows a finger can hit. */
        .toc summary {
          padding: 6px 12px;
        }
        .toc li > button {
          padding: 4px;
        }
        .side > .legend {
          position: static;
          max-width: none;
          margin: 0 -16px -16px;
          padding: 8px 16px 12px;
        }
        /* On the timeline the strip grows down, and the timeline bar sits on it. */
        body[data-view="timeline"] .side > .legend {
          padding-bottom: 88px;
        }
        /* With no panel, the legend is what goes to the bottom of the column. */
        .side > .panel[hidden] + .legend {
          margin-top: auto;
        }
        .legend ul {
          justify-content: flex-start;
        }
      }

      /* The timeline: a play button, the day, the last change, and a slider with the days. */
      .timeline {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 12px;
        z-index: 2; /* over the strip the legend becomes on a narrow window */
        user-select: none;
      }
      .timeline .now {
        display: flex;
        gap: 16px;
        margin-bottom: 4px;
      }
      .timeline .play {
        width: 64px;
        text-align: left;
        text-decoration: none;
      }
      .timeline .day {
        width: 56px;
        font-weight: 700;
      }
      .timeline .change {
        color: var(--grey);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .timeline input {
        display: block;
        width: 100%;
        margin: 0;
        accent-color: var(--ink);
      }
      .timeline .days {
        position: relative;
        height: 16px;
        color: var(--grey);
      }
      .timeline .days span {
        position: absolute;
        padding-left: 4px;
        border-left: 1px solid var(--grey);
      }

      /* The timeline bar is there only in the timeline view. */
      body:not([data-view="timeline"]) .timeline {
        display: none;
      }

      /* The page of a topic, over the graph. */
      .page {
        width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 64px);
        padding: 0;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font: 12px / 1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      .page[open] {
        display: flex;
        flex-direction: column;
      }
      .page::backdrop {
        background: rgb(242 241 236 / 0.85);
      }
      .page header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 24px;
        border-bottom: 1px solid var(--ink);
        color: var(--grey);
      }
      .page article {
        overflow: auto;
        padding: 8px 24px 32px;
      }
      .page h1 {
        font-size: 18px;
        line-height: 1.3;
      }
      .page h2 {
        margin-top: 32px;
        font-size: 14px;
      }
      .page h3 {
        font-size: 12px;
      }
      .page pre {
        overflow: auto;
        padding: 12px;
        border: 1px solid var(--grey);
      }
      .page :not(pre) > code {
        background: rgb(22 22 26 / 0.07);
        padding: 1px 3px;
      }
      .page table {
        border-collapse: collapse;
      }
      .page th,
      .page td {
        padding: 4px 10px;
        border: 1px solid var(--grey);
        text-align: left;
        vertical-align: top;
      }
    </style>
  </head>
  <body data-view="map">
    <div class="side">
      <header class="title">
        <h1><a href="../">← FORCE</a> · topic map</h1>
        <p><span data-count="all"></span> topics</p>
      </header>
      <button
        class="toc-toggle"
        type="button"
        aria-label="Open the list of topics"
        aria-expanded="false"
        aria-controls="toc"
      >
        <!-- A magnifying glass while the list is closed, a cross while it is open. -->
        <svg class="closed" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path
            d="M10.25 6a4.25 4.25 0 1 1-8.5 0a4.25 4.25 0 0 1 8.5 0zM9 9l4 4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.25"
          />
        </svg>
        <svg class="open" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-width="1.25" />
        </svg>
      </button>
      <nav class="toc" id="toc" aria-label="Topics">
        <input class="search" type="search" placeholder="search…" aria-label="Search the topics" />
        <div class="list"></div>
      </nav>
      <aside class="panel" hidden></aside>
      <div class="legend">
        <ul>
          <li>
            <span class="mark studied"></span> studied
            <span class="count" data-count="studied"></span>
          </li>
          <li>
            <span class="mark seen"></span> seen
            <span class="count" data-count="seen"></span>
          </li>
          <li>
            <span class="mark mentioned"></span> mentioned
            <span class="count" data-count="mentioned"></span>
          </li>
        </ul>
        <ul>
          <li><span class="mark"></span> concept</li>
          <li><span class="mark square"></span> source</li>
        </ul>
        <ul class="areas"></ul>
      </div>
    </div>
    <nav class="views">
      <button type="button" data-view="map" aria-pressed="true">map</button>
      <button type="button" data-view="timeline" aria-pressed="false">timeline</button>
    </nav>
    <div class="timeline">
      <div class="now">
        <button class="play" type="button">▶ play</button>
        <span class="day"></span>
        <span class="change"></span>
      </div>
      <input type="range" min="0" max="1" step="any" value="1" aria-label="Timeline" />
      <div class="days"></div>
    </div>
    <dialog class="page">
      <header>
        <span class="path"></span>
        <button class="close" type="button">close ×</button>
      </header>
      <article></article>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
