    <title>FORCE: a cloth</title>
    <meta
      name="description"
      content="A cloth of particles joined by springs, hanging by its top edge on the GPU: it swings, folds around a ball and can be pushed with the pointer."

    class="stage"
    data-springs="cloth"
    data-sizes="1"

    data-half="8"
    data-ball="3"
    data-ball-height="4"
    data-friction="0.3"
  >
    <nav class="crumb">
      <a href="../">← FORCE</a> · A cloth
      <p>Particles joined to their neighbours by springs, held by the top row. Move the pointer over the cloth to push it.</p>
